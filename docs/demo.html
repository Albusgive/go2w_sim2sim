<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go2W Lab2mj Demo</title>
  <meta name="description" content="Browser Go2W lab2mj MuJoCo and ONNX demo.">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="demo-body">
  <canvas id="go2w-canvas"></canvas>

  <aside class="demo-panel" aria-label="Go2W controls">
    <div class="panel-head">
      <a class="back-link" href="index.html">Go2W Sim2Sim</a>
      <span id="status-pill" class="status-pill">Loading</span>
    </div>

    <section class="control-group">
      <h2>Command</h2>
      <label>
        <span>Forward</span>
        <input id="cmd-x" type="range" min="-1.0" max="1.2" step="0.05" value="0.7">
        <output id="cmd-x-out">0.70</output>
      </label>
      <label>
        <span>Lateral</span>
        <input id="cmd-y" type="range" min="-0.8" max="0.8" step="0.05" value="0">
        <output id="cmd-y-out">0.00</output>
      </label>
      <label>
        <span>Yaw</span>
        <input id="cmd-yaw" type="range" min="-1.5" max="1.5" step="0.05" value="0">
        <output id="cmd-yaw-out">0.00</output>
      </label>
    </section>

    <section class="control-group">
      <h2>Policy Slot</h2>
      <div class="policy-grid" id="policy-grid">
        <button type="button" data-policy="0" class="active">motion_mlp ONNX</button>
        <button type="button" data-policy="1">vtm</button>
        <button type="button" data-policy="2">vtm_lstm_sru</button>
        <button type="button" data-policy="3">vtm_gru_sru</button>
      </div>
    </section>

    <section class="control-group compact-actions">
      <button id="zero-command" type="button">Zero</button>
      <button id="reset-sim" type="button">Reset Sim</button>
    </section>

    <section class="control-group">
      <h2>Realtime</h2>
      <label>
        <span>Factor</span>
        <input id="realtime" type="range" min="0.05" max="1.0" step="0.05" value="1.0">
        <output id="realtime-out">1.00</output>
      </label>
    </section>

    <div class="hud-line">
      <span id="policy-readout">policy 0: motion_mlp</span>
      <span>MuJoCo WASM + ONNX Runtime Web</span>
    </div>
    <p id="error-readout" class="error-readout" hidden></p>
  </aside>

  <script type="importmap">
    {
      "imports": {
        "three": "./assets/vendor/three/three.module.js"
      }
    }
  </script>
  <script src="assets/vendor/onnxruntime-web/ort.wasm.min.js?v=motion-onnx-2"></script>
  <script type="module" src="assets/js/go2w-demo.js?v=motion-onnx-2"></script>
</body>
</html>
